<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>AC Control</title>
<style>
:root{
  --bg:#0b1220; --panel:#121b2e; --panel2:#18233b; --line:#25324d;
  --text:#e8eef9; --muted:#8a99b5; --accent:#4cc3ff; --good:#2ecc71; --bad:#ff5a5f;
  --cool:#4cc3ff; --heat:#ff8a4c; --dry:#b89cff; --fan:#7be0c3; --auto:#f4b942;
  --safe-top:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
/* solid cover so nothing fades/grays under the status bar */
.safe-cover{position:fixed;top:0;left:0;right:0;height:var(--safe-top);background:var(--bg);z-index:100}
header{position:sticky;top:var(--safe-top);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:12px 16px}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.2px;flex:1}
header h1 span{color:var(--accent)}
.ver{color:var(--muted);font-size:12px;font-weight:500;margin-left:6px}
main{max-width:980px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto}
.tab{background:var(--panel);border:1px solid var(--line);color:var(--muted);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab.on{color:#06121f;background:var(--accent);border-color:var(--accent)}
.tab small{opacity:.7;font-weight:500;margin-left:4px}

button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--panel2);border:1px solid var(--line);padding:8px 14px;border-radius:10px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#06121f;border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.icon{padding:8px 11px}

/* hover hints on every button */
[data-hint]{position:relative}
[data-hint]:hover::after{content:attr(data-hint);position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:#000;color:#fff;font-size:12px;font-weight:500;padding:5px 9px;border-radius:7px;white-space:nowrap;z-index:300;pointer-events:none;border:1px solid var(--line)}
header [data-hint]:last-child:hover::after{left:auto;right:0;transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--mc,var(--line))}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.room{font-size:17px;font-weight:650}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--bad)}
.power{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:20px}
.power.on{background:var(--good);color:#04200f;border-color:var(--good)}
.target{display:flex;align-items:center;justify-content:center;gap:18px;margin:18px 0 6px}
.target .t{font-size:54px;font-weight:300;letter-spacing:-1px;min-width:110px;text-align:center}
.target .t sup{font-size:20px;color:var(--muted);font-weight:500}
.round{width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:22px;line-height:1}
.round:hover{border-color:var(--accent)}
.meas{display:flex;justify-content:center;gap:18px;color:var(--muted);font-size:13px;margin-bottom:14px}
.meas b{color:var(--text);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.seg button{flex:1;min-width:58px;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{color:#06121f;background:var(--c,var(--accent));border-color:var(--c,var(--accent))}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:14px}
.aq{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin-top:14px}
.tile{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .v{font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:11px;color:var(--muted);font-weight:500;margin-left:3px}
.tile .s{font-size:11px;color:var(--muted)}
.tile .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.tile.good .d{background:var(--good)} .tile.ok .d{background:var(--auto)} .tile.poor .d{background:var(--heat)} .tile.bad .d{background:var(--bad)}
.kv{display:grid;gap:0}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.timerline{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px dashed var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.timerline b{color:var(--text)}
.footrow{display:flex;gap:8px;margin-top:14px}
.footrow .btn{flex:1}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{color:var(--text);margin:0 0 6px}
.ph{background:var(--panel);border:1px dashed var(--line);border-radius:18px;padding:40px 20px;text-align:center;color:var(--muted)}
.ph h2{color:var(--text);margin:0 0 6px;font-size:18px}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;margin-top:10px}

/* floating pop-up windows */
.scrim{position:fixed;inset:0;background:rgba(3,8,16,.6);backdrop-filter:blur(3px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.scrim.open{display:flex}
.win{width:100%;max-width:460px;max-height:calc(100vh - 32px - var(--safe-top));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.win header{position:sticky;top:0;border-radius:18px 18px 0 0;background:var(--panel);padding:14px 16px}
.win header h1{font-size:16px}
.win .body{padding:16px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.6px}
input[type=text],input[type=password],input[type=time],select{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.tests{margin-top:14px;display:grid;gap:8px}
.test{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line)}
.test .badge{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#04120a;background:var(--muted)}
.test.pass{border-color:var(--good)} .test.pass .badge{background:var(--good)}
.test.fail{border-color:var(--bad)} .test.fail .badge{background:var(--bad);color:#fff}
.test small{display:block;color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#000;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:400;display:none;font-size:14px}
.toast.err{border-color:var(--bad)}
.spin{opacity:.5;pointer-events:none}
</style>
</head>
<body>
<div class="safe-cover"></div>
<header>
  <h1>AC <span>Control</span><span class="ver" id="verTag"></span></h1>
  <button class="btn icon" id="btnRefresh" data-hint="Refresh all units">⟳</button>
  <button class="btn icon" id="btnTest" data-hint="Connection test (pass / fail)">✓ Test</button>
  <button class="btn icon" id="btnSettings" data-hint="Settings and API key">⚙</button>
</header>

<main>
  <div class="tabs" id="tabs"></div>
  <div id="view"></div>
</main>

<!-- Settings window -->
<div class="scrim" id="winSettings"><div class="win">
  <header><h1>Settings</h1><button class="btn icon" data-close data-hint="Close">✕</button></header>
  <div class="body">
    <label for="relayIn">Relay URL (Cloudflare Worker)</label>
    <input type="text" id="relayIn" autocomplete="off" autocapitalize="off" placeholder="https://ac-relay.your-name.workers.dev">
    <p class="note">Needed because Sensibo blocks direct calls from web pages. Leave empty to try a direct connection.</p>
    <label for="keyIn">Sensibo API key (Cabana)</label>
    <input type="password" id="keyIn" autocomplete="off" placeholder="Paste your Sensibo API key">
    <div class="footrow">
      <button class="btn primary" id="saveKey" data-hint="Save the key on this device only">Save</button>
      <button class="btn" id="copyKey" data-hint="Copy the saved key to the clipboard">Copy key</button>
      <button class="btn danger" id="rmKey" data-hint="Remove the saved key (asks first)">Remove</button>
    </div>
    <p class="note">The key is stored only in this browser (local storage). It is never part of this file.</p>
    <label for="unitSel">Temperature unit</label>
    <select id="unitSel"><option value="C">Celsius (°C)</option><option value="F">Fahrenheit (°F)</option></select>
  </div>
</div></div>

<!-- Connection test window -->
<div class="scrim" id="winTest"><div class="win">
  <header><h1>Connection test</h1><button class="btn icon" data-close data-hint="Close">✕</button></header>
  <div class="body">
    <button class="btn primary" id="runTest" data-hint="Run the three checks again">Run test</button>
    <div class="tests" id="testList"></div>
  </div>
</div></div>

<!-- Timer window -->
<div class="scrim" id="winTimer"><div class="win">
  <header><h1 id="timerTitle">Start timer</h1><button class="btn icon" data-close data-hint="Close">✕</button></header>
  <div class="body">
    <label for="tTime">Start at</label>
    <input type="time" id="tTime">
    <label for="tMode">Mode</label>
    <select id="tMode"></select>
    <label for="tTemp">Target temperature</label>
    <select id="tTemp"></select>
    <p class="note" id="tNote"></p>
    <div class="footrow">
      <button class="btn primary" id="tSet" data-hint="Schedule the AC to turn on at this time">Set timer</button>
      <button class="btn danger" id="tClear" data-hint="Cancel the existing timer">Cancel timer</button>
    </div>
  </div>
</div></div>

<!-- Details window -->
<div class="scrim" id="winDetails"><div class="win">
  <header><h1 id="detTitle">Details</h1><button class="btn icon" data-close data-hint="Close">✕</button></header>
  <div class="body"><div class="kv" id="detBody"></div></div>
</div></div>

<div class="toast" id="toast"></div>

<script>
const VERSION = "v0.4";
document.getElementById("verTag").textContent = VERSION;

const API = "https://home.sensibo.com/api/v2";
const LS = { key:"acctl.sensibo.key", unit:"acctl.unit", tab:"acctl.tab", relay:"acctl.relay" };
const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} },
  del(k){ try{ localStorage.removeItem(k) }catch(e){} }
};
let unit = store.get(LS.unit) || "C";
let pods = [];          // Sensibo devices
let timers = {};        // podId -> timer
let tab = store.get(LS.tab) || "cabana";
let timerPod = null;

const MODE_COLOR = {cool:"var(--cool)",heat:"var(--heat)",dry:"var(--dry)",fan:"var(--fan)",auto:"var(--auto)"};
const MODE_LABEL = {cool:"Cool",heat:"Heat",dry:"Dry",fan:"Fan",auto:"Auto"};

function toast(msg, err){
  const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err?" err":""); t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.style.display="none", 2800);
}
const key = () => store.get(LS.key);
const relay = () => (store.get(LS.relay)||"").trim().replace(/\/+$/,"");
const base = () => relay() ? relay()+"/sensibo/v2" : API;

async function api(path, opts={}){
  const k = key(); if(!k) throw new Error("No API key saved");
  const sep = path.includes("?") ? "&" : "?";
  const res = await fetch(base() + path + sep + "apiKey=" + encodeURIComponent(k), {
    method: opts.method || "GET",
    headers: opts.body ? {"Content-Type":"application/json"} : undefined,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!res.ok){
    let m = res.status + " " + res.statusText;
    try{ const j = await res.json(); if(j.reason||j.message) m = j.reason||j.message }catch(e){}
    throw new Error(m);
  }
  return res.json();
}

/* ---------- tabs ---------- */
const LOCS = [
  {id:"cabana", name:"Cabana", sub:"Sensibo"},
  {id:"hawaii", name:"Hawaii", sub:"FGLair"},
  {id:"shuswap", name:"Shuswap", sub:"Airstage"}
];
function renderTabs(){
  $("#tabs").innerHTML = LOCS.map(l =>
    `<button class="tab ${tab===l.id?"on":""}" data-tab="${l.id}" data-hint="Show ${l.name}">${l.name}<small>${l.sub}</small></button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { tab=b.dataset.tab; store.set(LS.tab,tab); renderTabs(); render(); });
}

/* ---------- rendering ---------- */
const toUnit = c => unit==="F" ? Math.round(c*9/5+32) : Math.round(c*10)/10;
function render(){
  const v = $("#view");
  if(tab !== "cabana"){
    const l = LOCS.find(x=>x.id===tab);
    v.innerHTML = `<div class="ph"><h2>${l.name}</h2>Fujitsu units on ${l.sub}.<br><span class="pill">Placeholder — coming next</span></div>`;
    return;
  }
  if(!key()){
    v.innerHTML = `<div class="empty"><h2>Add your Sensibo key</h2>Open Settings (⚙) and paste your API key to connect Cabana.</div>`;
    return;
  }
  if(!pods.length){
    v.innerHTML = `<div class="empty"><h2>Loading units…</h2></div>`;
    return;
  }
  v.innerHTML = `<div class="grid">${pods.map(card).join("")}</div>`;
  bind();
}
function card(p){
  const s = p.acState || {}, m = p.measurements || {};
  const mode = s.mode || "cool";
  const online = p.connectionStatus ? p.connectionStatus.isAlive : true;
  const caps = (p.remoteCapabilities && p.remoteCapabilities.modes) || {};
  const modes = Object.keys(caps).length ? Object.keys(caps) : ["cool","heat","dry","fan","auto"];
  const mc = caps[mode] || {};
  const fans = mc.fanLevels || ["auto","low","medium","high"];
  const tmp = s.targetTemperature;
  const tm = timers[p.id];
  let tline = `<span>No start timer set</span>`;
  if(tm && tm.targetTimeStamp){ tline = `<span>Starts at <b>${new Date(tm.targetTimeStamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</b></span>`; }
  return `<div class="card" id="pod-${p.id}" style="--mc:${s.on?MODE_COLOR[mode]:"var(--line)"}">
    <div class="row">
      <div><div class="room">${p.room ? p.room.name : "AC"}</div>
        <div class="status"><span class="dot ${online?"on":"off"}"></span>${online?"Online":"Offline"} · ${s.on?"Running":"Off"}</div></div>
      <button class="power ${s.on?"on":""}" data-act="power" data-id="${p.id}" data-hint="${s.on?"Turn off":"Turn on"}">⏻</button>
    </div>
    <div class="target">
      <button class="round" data-act="dec" data-id="${p.id}" data-hint="Lower target temperature">−</button>
      <div class="t">${tmp!=null ? tmp : "--"}<sup>°${s.temperatureUnit||unit}</sup></div>
      <button class="round" data-act="inc" data-id="${p.id}" data-hint="Raise target temperature">+</button>
    </div>
    <div class="meas"><span>Room <b>${m.temperature!=null ? toUnit(m.temperature)+"°"+unit : "--"}</b></span><span>Humidity <b>${m.humidity!=null ? Math.round(m.humidity)+"%" : "--"}</b></span></div>
    ${aqTiles(p)}
    <div class="lbl">Mode</div>
    <div class="seg">${modes.map(x=>`<button class="${x===mode?"on":""}" style="--c:${MODE_COLOR[x]||"var(--accent)"}" data-act="mode" data-v="${x}" data-id="${p.id}" data-hint="Set mode to ${MODE_LABEL[x]||x}">${MODE_LABEL[x]||x}</button>`).join("")}</div>
    <div class="lbl">Fan</div>
    <div class="seg">${fans.map(x=>`<button class="${x===s.fanLevel?"on":""}" data-act="fan" data-v="${x}" data-id="${p.id}" data-hint="Set fan to ${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")}</div>
    ${(()=>{ const mh=minHeat(p); return `<div class="footrow">${mh ? `<button class="btn" data-act="minheat" data-id="${p.id}" data-hint="Heat at the lowest temperature this unit allows (${mh.t}°${mh.u})">Min heat · ${mh.t}°${mh.u}</button>` : ""}<button class="btn" data-act="details" data-id="${p.id}" data-hint="Signal, firmware, filter and other readings">Details</button></div>`; })()}
    <div class="timerline">${tline}<button class="btn" data-act="timer" data-id="${p.id}" data-hint="Set a time for the AC to start">⏱ Timer</button></div>
  </div>`;
}
const AQ = {
  co2:  {label:"CO₂",  unit:"ppm",   lim:[800,1000,1500], names:["Good","Fair","Poor","Bad"]},
  tvoc: {label:"TVOC", unit:"ppb",   lim:[220,660,2200],  names:["Good","Fair","Poor","Bad"]},
  pm25: {label:"PM2.5",unit:"µg/m³", lim:[12,35,55],      names:["Good","Fair","Poor","Bad"]}
};
const LV = ["good","ok","poor","bad"];
function aqTiles(p){
  const m = p.measurements || {}; let out = "";
  Object.keys(AQ).forEach(k => {
    if(m[k]==null) return;
    const a = AQ[k], v = m[k]; let i = a.lim.findIndex(x => v < x); if(i<0) i = 3;
    out += `<div class="tile ${LV[i]}"><div class="k"><span class="d"></span>${a.label}</div><div class="v">${Math.round(v)}<small>${a.unit}</small></div><div class="s">${a.names[i]}</div></div>`;
  });
  if(m.feelsLike!=null) out += `<div class="tile"><div class="k">Feels like</div><div class="v">${toUnit(m.feelsLike)}<small>°${unit}</small></div></div>`;
  if(m.temperature!=null && m.humidity!=null){
    const g = Math.log(m.humidity/100) + 17.62*m.temperature/(243.12+m.temperature);
    const dp = 243.12*g/(17.62-g);
    out += `<div class="tile"><div class="k">Dew point</div><div class="v">${toUnit(dp)}<small>°${unit}</small></div></div>`;
  }
  return out ? `<div class="aq">${out}</div>` : "";
}
function ago(sec){
  if(sec==null) return "--"; if(sec<90) return "just now";
  if(sec<5400) return Math.round(sec/60)+" min ago"; if(sec<172800) return Math.round(sec/3600)+" h ago";
  return Math.round(sec/86400)+" days ago";
}
function openDetails(p){
  const m = p.measurements || {}, cs = p.connectionStatus || {}, f = p.filtersCleaning || {};
  const rows = [];
  rows.push(["Model", p.productModel || "--"]);
  rows.push(["Firmware", p.firmwareVersion || "--"]);
  rows.push(["Last seen", cs.lastSeen ? ago(cs.lastSeen.secondsAgo) : (cs.isAlive===false ? "Offline" : "Now")]);
  if(m.rssi!=null){ const q = m.rssi>-60?"Strong":m.rssi>-75?"Good":m.rssi>-85?"Weak":"Very weak"; rows.push(["Wi-Fi signal", q+" ("+m.rssi+" dBm)"]); }
  if(m.motion!=null) rows.push(["Motion", m.motion ? "Detected" : "None"]);
  if(f.filtersCleanSecondsThreshold){
    const pct = Math.min(100, Math.round(100*(f.acOnSecondsSinceLastFiltersClean||0)/f.filtersCleanSecondsThreshold));
    rows.push(["Filter", f.shouldCleanFilters ? "Clean now ("+pct+"% used)" : pct+"% used"]);
  }
  const known = ["temperature","humidity","feelsLike","rssi","motion","co2","tvoc","pm25","time"];
  Object.keys(m).filter(k => known.indexOf(k)<0 && typeof m[k]==="number").forEach(k => rows.push([k, String(m[k])]));
  rows.push(["Refreshed", lastLoad ? lastLoad.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}) : "--"]);
  $("#detTitle").textContent = "Details — " + (p.room ? p.room.name : "AC");
  $("#detBody").innerHTML = rows.map(r => `<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("");
  openWin("winDetails");
}
let lastLoad = null;
function minHeat(p){
  const u = (p.acState && p.acState.temperatureUnit) || "C";
  const h = p.remoteCapabilities && p.remoteCapabilities.modes && p.remoteCapabilities.modes.heat;
  const v = h && h.temperatures && h.temperatures[u] && h.temperatures[u].values;
  return v && v.length ? {t:Math.min.apply(null,v), u:u} : null;
}
function bind(){
  document.querySelectorAll("[data-act]").forEach(b => b.onclick = () => act(b.dataset.act, b.dataset.id, b.dataset.v));
}

/* ---------- actions ---------- */
function range(p){
  const s = p.acState, caps = p.remoteCapabilities && p.remoteCapabilities.modes && p.remoteCapabilities.modes[s.mode];
  const u = s.temperatureUnit || "C";
  const vals = caps && caps.temperatures && caps.temperatures[u] && caps.temperatures[u].values;
  return vals && vals.length ? vals : null;
}
async function pushState(p, patch){
  const el = document.getElementById("pod-"+p.id); if(el) el.classList.add("spin");
  const next = Object.assign({}, p.acState, patch);
  try{
    const r = await api(`/pods/${p.id}/acStates`, {method:"POST", body:{acState: next}});
    p.acState = (r.result && r.result.acState) || next;
  }catch(e){ toast("Failed: "+e.message, true); }
  render();
}
async function act(a, id, v){
  const p = pods.find(x=>x.id===id); if(!p) return;
  const s = p.acState;
  if(a==="details") return openDetails(p);
  if(a==="power") return pushState(p,{on:!s.on});
  if(a==="minheat"){ const mh=minHeat(p); if(!mh) return; return pushState(p,{mode:"heat", on:true, targetTemperature:mh.t}); }
  if(a==="mode")  return pushState(p,{mode:v, on:true});
  if(a==="fan")   return pushState(p,{fanLevel:v});
  if(a==="inc"||a==="dec"){
    const vals = range(p); let cur = s.targetTemperature; if(cur==null) return;
    let nx;
    if(vals){ const i = vals.indexOf(cur); const j = Math.max(0,Math.min(vals.length-1,(i<0?0:i)+(a==="inc"?1:-1))); nx = vals[j]; }
    else nx = cur + (a==="inc"?1:-1);
    return pushState(p,{targetTemperature:nx});
  }
  if(a==="timer") return openTimer(p);
}

/* ---------- timer ---------- */
function openTimer(p){
  timerPod = p;
  $("#timerTitle").textContent = "Start timer — " + (p.room ? p.room.name : "AC");
  const caps = (p.remoteCapabilities && p.remoteCapabilities.modes) || {};
  const modes = Object.keys(caps).length ? Object.keys(caps) : ["cool","heat","dry","fan","auto"];
  $("#tMode").innerHTML = modes.map(m=>`<option value="${m}" ${m===p.acState.mode?"selected":""}>${MODE_LABEL[m]||m}</option>`).join("");
  const fill = () => {
    const mm = $("#tMode").value, u = p.acState.temperatureUnit || "C";
    const vals = (caps[mm] && caps[mm].temperatures && caps[mm].temperatures[u] && caps[mm].temperatures[u].values) || [];
    $("#tTemp").innerHTML = vals.length ? vals.map(t=>`<option ${t===p.acState.targetTemperature?"selected":""}>${t}</option>`).join("") : `<option value="">Keep current</option>`;
  };
  $("#tMode").onchange = fill; fill();
  const d = new Date(Date.now()+3600e3); $("#tTime").value = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  $("#tNote").textContent = "The AC turns on at the chosen time (next occurrence) with the mode and temperature above.";
  openWin("winTimer");
}
$("#tSet").onclick = async () => {
  const p = timerPod; if(!p) return;
  const [h,m] = $("#tTime").value.split(":").map(Number);
  if(isNaN(h)){ toast("Pick a time", true); return; }
  const now = new Date(), at = new Date(); at.setHours(h,m,0,0); if(at<=now) at.setDate(at.getDate()+1);
  const mins = Math.max(1, Math.round((at-now)/60000));
  const st = Object.assign({}, p.acState, {on:true, mode:$("#tMode").value});
  const tv = $("#tTemp").value; if(tv) st.targetTemperature = Number(tv);
  try{
    await api(`/pods/${p.id}/timer/`, {method:"PUT", body:{minutesFromNow:mins, acState:st}});
    await loadTimer(p.id); closeWins(); render(); toast("Timer set for "+at.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  }catch(e){ toast("Failed: "+e.message, true); }
};
$("#tClear").onclick = async () => {
  const p = timerPod; if(!p) return;
  try{ await api(`/pods/${p.id}/timer/`, {method:"DELETE"}); delete timers[p.id]; closeWins(); render(); toast("Timer cancelled"); }
  catch(e){ toast("Failed: "+e.message, true); }
};
async function loadTimer(id){
  try{ const r = await api(`/pods/${id}/timer/`); if(r.result && r.result.targetTimeStamp) timers[id] = r.result; else delete timers[id]; }
  catch(e){ delete timers[id]; }
}

/* ---------- data load (pre-loaded on open) ---------- */
async function load(silent){
  if(!key()){ render(); return; }
  try{
    const r = await api("/users/me/pods?fields=*");
    pods = r.result || [];
    await Promise.all(pods.map(p=>loadTimer(p.id)));
    lastLoad = new Date();
  }catch(e){ if(silent) return; pods = []; $("#view").innerHTML = `<div class="empty"><h2>Couldn't load units</h2>${e.message}<br>Open the ✓ Test to see which check fails.</div>`; return; }
  render();
}

/* ---------- windows ---------- */
function openWin(id){ closeWins(); $("#"+id).classList.add("open"); }
function closeWins(){ document.querySelectorAll(".scrim").forEach(s=>s.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeWins);
document.querySelectorAll(".scrim").forEach(s=>s.addEventListener("click",e=>{ if(e.target===s) closeWins(); }));

$("#btnSettings").onclick = () => { $("#keyIn").value = key() || ""; $("#relayIn").value = relay(); $("#unitSel").value = unit; openWin("winSettings"); };
$("#saveKey").onclick = () => { const v=$("#keyIn").value.trim(); store.set(LS.relay,$("#relayIn").value.trim()); if(!v && !key()){ toast("Enter a key",true); return; } if(v) store.set(LS.key,v); closeWins(); toast("Saved"); load(); };
$("#copyKey").onclick = async () => { const k=key(); if(!k){ toast("No key saved",true); return; } try{ await navigator.clipboard.writeText(k); toast("Key copied"); }catch(e){ toast("Copy blocked by browser",true); } };
$("#rmKey").onclick = () => { if(!key()){ toast("No key saved",true); return; } if(confirm("Remove the saved API key from this device?")){ store.del(LS.key); pods=[]; timers={}; $("#keyIn").value=""; closeWins(); render(); toast("Key removed"); } };
$("#unitSel").onchange = e => { unit=e.target.value; store.set(LS.unit,unit); render(); };
$("#btnRefresh").onclick = () => { toast("Refreshing…"); load(); };

/* ---------- pass / fail connection test ---------- */
function tRow(ok,title,detail){ return `<div class="test ${ok?"pass":"fail"}"><div class="badge">${ok?"✓":"✕"}</div><div>${title}<small>${detail}</small></div></div>`; }
async function runTest(){
  const out = [];
  const L = $("#testList");
  const k = key();
  out.push(tRow(!!k,"API key saved", k ? "Key found on this device" : "No key — add it in Settings"));
  L.innerHTML = out.join("");
  if(!k) return;
  let pl = null;
  if(relay()){
    try{ const r = await fetch(relay()+"/ping"); out.push(tRow(r.ok,"Reached relay", r.ok ? "Worker answered" : "HTTP "+r.status)); }
    catch(e){ out.push(tRow(false,"Reached relay","Blocked or wrong URL: "+e.message)); }
    L.innerHTML = out.join("");
  } else out.push(tRow(false,"Relay set","No relay URL; direct calls are usually blocked by CORS"));
  L.innerHTML = out.join("");
  try{
    const r = await fetch(base()+"/users/me/pods?fields=id,room&apiKey="+encodeURIComponent(k));
    if(r.ok){ pl = (await r.json()).result || []; out.push(tRow(true,"Reached Sensibo","Browser can talk to the API")); }
    else out.push(tRow(false,"Reached Sensibo","HTTP "+r.status+(r.status===401||r.status===403?" — key rejected":"")));
  }catch(e){ out.push(tRow(false,"Reached Sensibo","Blocked or offline: "+e.message)); }
  L.innerHTML = out.join("");
  if(pl) out.push(tRow(pl.length>0,"Units found", pl.length ? pl.map(p=>p.room&&p.room.name).filter(Boolean).join(", ") : "Key works but no devices returned"));
  L.innerHTML = out.join("");
}
$("#runTest").onclick = runTest;
$("#btnTest").onclick = () => { openWin("winTest"); runTest(); };

renderTabs(); render(); load();
setInterval(() => { if(document.hidden || tab!=="cabana" || !key() || document.querySelector(".scrim.open")) return; load(true); }, 60000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && key() && !document.querySelector(".scrim.open")) load(true); });
</script>
